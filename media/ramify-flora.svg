        <ellipse cy="-31" rx="9" ry="17" transform="rotate(60)"/><ellipse cy="-31" rx="9" ry="17" transform="rotate(90)"/>
        <ellipse cy="-31" rx="9" ry="17" transform="rotate(120)"/><ellipse cy="-31" rx="9" ry="17" transform="rotate(150)"/>
        <ellipse cy="-31" rx="9" ry="17" transform="rotate(180)"/><ellipse cy="-31" rx="9" ry="17" transform="rotate(210)"/>
        <ellipse cy="-31" rx="9" ry="17" transform="rotate(240)"/><ellipse cy="-31" rx="9" ry="17" transform="rotate(270)"/>
        <ellipse cy="-31" rx="9" ry="17" transform="rotate(300)"/><ellipse cy="-31" rx="9" ry="17" transform="rotate(330)"/>
