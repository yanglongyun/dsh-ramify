<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Ramify flora garden</title>
  <desc id="desc">Five hand-drawn plants: a red flower, succulent, sunflower, pine, and bamboo.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#e0d9cc"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="1198" height="258" rx="28" fill="#f7f3ec" stroke="#e7e1d6" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="258" rx="28" fill="url(#dots)" opacity=".72"/>
  <path d="M70 222 C300 216 450 226 610 219 C790 211 960 228 1130 219" fill="none" stroke="#2c2827" stroke-width="2.4" stroke-linecap="round" opacity=".16"/>

  <!-- 小红花 -->
  <g transform="translate(150 18)">
    <path d="M0 202 C-2 163 3 128 0 92" fill="none" stroke="#7d8c77" stroke-width="5" stroke-linecap="round"/>
    <path d="M0 158 C-28 154 -38 130 -9 140 C-3 144 0 151 0 158Z" fill="#9ab08f" stroke="#2c2827" stroke-width="2.6" stroke-linejoin="round"/>
