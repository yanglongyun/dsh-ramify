  <g transform="translate(1050 8)">
    <path d="M-18 210 L-18 63 M30 210 L30 88" fill="none" stroke="#7d8c77" stroke-width="9" stroke-linecap="round"/>
    <path d="M-24 165 H-12 M-24 120 H-12 M-24 78 H-12 M24 170 H36 M24 128 H36" fill="none" stroke="#2c2827" stroke-width="3" stroke-linecap="round"/>
