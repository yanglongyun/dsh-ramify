      <ellipse cx="0" cy="-22" rx="14" ry="21" fill="#d95b57"/>
      <ellipse cx="0" cy="-22" rx="14" ry="21" fill="#d95b57" transform="rotate(72)"/>
      <ellipse cx="0" cy="-22" rx="14" ry="21" fill="#d95b57" transform="rotate(144)"/>
      <ellipse cx="0" cy="-22" rx="14" ry="21" fill="#d95b57" transform="rotate(216)"/>
      <ellipse cx="0" cy="-22" rx="14" ry="21" fill="#d95b57" transform="rotate(288)"/>
      <circle r="12" fill="#eec16f"/>
    </g>
  </g>

  <!-- 治愈多肉 -->
  <g transform="translate(365 40)" stroke="#2c2827" stroke-linejoin="round">
    <path d="M-58 146 C-77 116 -51 91 -30 108 C-35 82 -5 68 10 91 C27 68 57 85 48 111 C74 99 91 126 68 146Z" fill="#9ab08f" stroke-width="3"/>
    <path d="M-39 146 C-50 125 -34 108 -18 120 C-21 99 3 91 13 108 C27 94 48 107 41 127 C56 123 66 139 54 146Z" fill="#7d8c77" stroke-width="3"/>
